[package]
name = "offline_driver"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"


[dependencies]
log = "0.4.25"
env_logger = "0.11.6"
serde = { version = "1.0.210" }
notify = { version = "8.1.0", features = ["serde"] }
postcard = { version = "1.1.3", features = ["alloc"], default-features = false }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
