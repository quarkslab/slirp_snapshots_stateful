[package]
name = "offline_runner"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"


[dependencies]
log = "0.4.25"
env_logger = "0.11.6"
serde = { version = "1.0.210" }
serde_json = { version = "1.0.128" }
libafl = { path = "../../libafl/crates/libafl" }
libafl_bolts = { path = "../../libafl/crates/libafl_bolts" }
libafl_targets = { path = "../../libafl/crates/libafl_targets" }
libafl_qemu = { path = "../../libafl/crates/libafl_qemu", features = [
    "x86_64",
    "usermode",
    "asan_rust",
] }
postcard = { version = "1.1.3", features = ["alloc"], default-features = false }


[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
