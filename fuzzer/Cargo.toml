[package]
name = "slirp-snapshots-stateful-fuzzer"
version = "1.0.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
log = "0.4.25"
env_logger = "0.11.6"
libafl = { path = "../libafl/crates/libafl" }
libafl_bolts = { path = "../libafl/crates/libafl_bolts" }
libafl_targets = { path = "../libafl/crates/libafl_targets" }
libafl_qemu = { path = "../libafl/crates/libafl_qemu", features = [
    "x86_64",
    "usermode",
] }
hashbrown = { version = "0.16.0", default-features = false }
serde = { version = "1.0.210", default-features = false }
serde_json = { version = "1.0.128", default-features = false }
serde_yaml = { version = "0.9.34" }
lain = { git = "https://github.com/AFLplusplus/lain.git" }
postcard = { version = "1.1.3", features = ["alloc"], default-features = false }
xxhash-rust = { version = "0.8.15", default-features = false, features = [
    "const_xxh64",
    "xxh64",
] }
num_enum = "0.7.6"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
debug = true
